name: 'integration_tests'
version: '1.0.0'
config-version: 2

profile: 'default'



vars:

# Input database and schema
# (where the sources for this dbt project live):
  tuva_database: tuva

# Output database and schema
# (where the output of this package is dumped):
  cms_hcc_database: tuva
  cms_hcc_schema: cms_hcc



dispatch:
  - macro_namespace: dbt
    search_order: [ 'cms_hcc', 'dbt']


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  integration_tests:
    +materialized: ephemeral
    +database: dev_user
