version: 2

sources:
  - name: core
    database: "{{ var('cms_hcc_input_database','tuva') }}"
    schema: "{{ var('cms_hcc_input_schema','core') }}"
    tables:
      - name: condition
        description: >
          Info about complaints, problems, admit diagnoses,
          discharge diagnoses, etc.

      - name: eligibility
        description: > 
          The eligibility table includes information about a patient's health 
          insurance coverage and demographics (note: we use the word patient as 
          a synonym for member). Every claims dataset should include some sort 
          of eligibility data, otherwise it's impossible to calculate member 
          months, which are needed to calculate measures like PMPM.

      - name: medical_claim
        description: >
          The medical_claim table contains information on healthcare services 
          and supplies provided to patients, billed by providers, and paid for 
          by health insurers. It includes information on the provider who 
          rendered the service, the amount paid for the service by the health 
          insurer, and the underlying reason for the service (i.e. diagnosis).