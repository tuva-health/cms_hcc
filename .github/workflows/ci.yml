name: Package CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  official-cms-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dbt with DuckDB
        run: python -m pip install dbt-core==1.11.13 dbt-duckdb==1.11.0
      - name: Install dependencies
        working-directory: integration_tests
        run: dbt deps --profiles-dir profiles
      - name: Run package unit tests
        working-directory: integration_tests
        run: dbt test --select test_type:unit --profiles-dir profiles
      - name: Build official CMS reference fixture
        working-directory: integration_tests
        run: >-
          dbt build --full-refresh
          --select +tag:official_cms_hcc_validation
          --profiles-dir profiles
