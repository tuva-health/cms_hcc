version: 2

seeds:
  - name: cms_hcc__cms_hcc_adjustment_rates
    description: Adjustment rates by payment year.
    config:
      database: "{{ var('cms_hcc_database',var('tuva_database','tuva')) }}"
      schema: |
        {%- if var('cms_hcc_schema',None) != None -%}{{var('cms_hcc_schema')}}
        {% else %}cms_hcc{%- endif -%}
      enabled: "{{ var('cms_hcc_enabled',var('tuva_packages_enabled',True)) }}"
      alias: adjustment_rates
      tags: cms_hcc

