version: 2

seeds:
  - name: cms_hcc__adjustment_rates
    description: >
      Adjustment rates by payment year. Extracted from rate announcement
      documents on cms.gov.
    config:
      database: "{{ var('cms_hcc_database',var('tuva_database','tuva')) }}"
      schema: |
        {%- if var('cms_hcc_schema',None) != None -%}{{var('cms_hcc_schema')}}
        {% else %}cms_hcc{%- endif -%}
      enabled: "{{ var('cms_hcc_enabled',var('tuva_packages_enabled',True)) }}"
      alias: _seed_adjustment_rates
      tags: cms_hcc
      column_types:
        coefficient: float

  - name: cms_hcc__cpt_hcpcs
    description: >
      CPT/HCPCS encounter filtering included list by payment year. Combined 
      and cleaned version of code files on cms.gov.
    config:
      database: "{{ var('cms_hcc_database',var('tuva_database','tuva')) }}"
      schema: |
        {%- if var('cms_hcc_schema',None) != None -%}{{var('cms_hcc_schema')}}
        {% else %}cms_hcc{%- endif -%}
      enabled: "{{ var('cms_hcc_enabled',var('tuva_packages_enabled',True)) }}"
      alias: _seed_cpt_hcpcs
      tags: cms_hcc

  - name: cms_hcc__demographic_factors
    description: > 
      Demographic factors by model version and risk segment. Extracted from 
      rate announcement documents on cms.gov.
    config:
      database: "{{ var('cms_hcc_database',var('tuva_database','tuva')) }}"
      schema: |
        {%- if var('cms_hcc_schema',None) != None -%}{{var('cms_hcc_schema')}}
        {% else %}cms_hcc{%- endif -%}
      enabled: "{{ var('cms_hcc_enabled',var('tuva_packages_enabled',True)) }}"
      alias: _seed_demographic_factors
      tags: cms_hcc
      column_types:
        coefficient: float

