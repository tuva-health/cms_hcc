        {% else %}cms_hcc{%- endif -%}
      enabled: "{{ var('cms_hcc_enabled',var('tuva_packages_enabled',True)) }}"
      alias: _seed_disabled_interaction_factors
      tags: cms_hcc
      column_types:
        hcc_code: |
          {%- if target.type == "bigquery" -%} string {%- else -%} varchar {%- endif -%}
        coefficient: float

