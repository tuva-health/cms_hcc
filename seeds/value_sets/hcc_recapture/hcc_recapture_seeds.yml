version: 2

seeds:
  - name: hcc_recapture__chronic_hccs
    description: >
      Default chronic HCC definitions for HCC recapture for payment year 2026.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_value_sets{% else %}value_sets{%- endif -%}
      alias: _value_set_hcc_recapture_chronic_hccs
      tags: ["cms_hcc", "hcc_recapture"]
      column_types:
        hcc_code: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        model_version: |
          {%- if target.type in ("bigquery", "databricks") -%} string {%- else -%} varchar(256) {%- endif -%}
        chronic_flag: integer
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - model_version
              - hcc_code
    columns:
      - name: hcc_code
        description: Hierarchical Condition Category code.
        data_tests:
          - not_null
      - name: model_version
        description: CMS-HCC model version.
        data_tests:
          - not_null
      - name: chronic_flag
        description: Indicates that the HCC is chronic and eligible for recapture.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1]
                quote: false
