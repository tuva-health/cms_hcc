version: 2

unit_tests:
  - name: test_cms_hcc_int_members_defaults_missing_orec_by_age
    description: >
      Verifies that members with missing OREC and Medicare Status default to the
      CMS age-based disabled logic: under 65 as Disabled and 65 or older as Aged.
      The under-65 fixture also verifies that an open-ended enrollment span is
      retained and capped to the payment-year boundary for coverage calculations.
    model: cms_hcc__int_members
    config:
      enabled: "{{ var('claims_enabled', False) | as_bool }}"
    overrides:
      vars:
        tuva_last_run: '2024-01-01 00:00:00'
    given:
      - input: ref('cms_hcc__stg_core__eligibility')
        format: sql
        rows: |
          {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar' %}
          {% set integer_type = 'int64' if target.type == 'bigquery' else 'integer' %}
          select
              'under_65' as person_id
            , 'medicare' as payer
            , cast('2023-01-01' as date) as enrollment_start_date
            , cast(null as date) as enrollment_end_date
            , cast(null as {{ string_type }}) as original_reason_entitlement_code
            , cast(null as {{ string_type }}) as dual_status_code
            , cast(null as {{ string_type }}) as medicare_status_code
            , cast(null as {{ string_type }}) as enrollment_status
            , cast(null as {{ integer_type }}) as long_term_institutional_flag
            , cast(null as {{ integer_type }}) as institutional_snp_flag
            , 'medicare cclf' as data_source
          union all
          select
              'sixty_five' as person_id
            , 'medicare' as payer
            , cast('2023-01-01' as date) as enrollment_start_date
            , cast('2024-12-31' as date) as enrollment_end_date
            , cast(null as {{ string_type }}) as original_reason_entitlement_code
            , cast(null as {{ string_type }}) as dual_status_code
            , cast(null as {{ string_type }}) as medicare_status_code
            , 'Continuing' as enrollment_status
            , cast(null as {{ integer_type }}) as long_term_institutional_flag
            , cast(null as {{ integer_type }}) as institutional_snp_flag
            , 'medicare cclf' as data_source
      - input: ref('cms_hcc__stg_core__patient')
        format: sql
        rows: |
          select
              'under_65' as person_id
            , 'female' as sex
            , cast('1959-02-02' as date) as birth_date
            , cast(null as date) as death_date
            , 'medicare cclf' as data_source
          union all
          select
              'sixty_five' as person_id
            , 'male' as sex
            , cast('1958-02-02' as date) as birth_date
            , cast(null as date) as death_date
            , 'medicare cclf' as data_source
      - input: ref('cms_hcc__int_monthly_collection_dates')
        format: sql
        rows: |
          select
              cast('2023-01-01' as date) as collection_start_date
            , cast('2023-12-31' as date) as collection_end_date
            , 2023 as collection_year
            , 2024 as payment_year
    expect:
      format: sql
      rows: |
        {% set string_type = 'string' if target.type in ['bigquery', 'databricks'] else 'varchar(max)' if target.type in ['fabric', 'sqlserver'] else 'varchar' %}
        {% set integer_type = 'int64' if target.type == 'bigquery' else 'integer' %}
        {% set boolean_type = 'bit' if target.type in ['fabric', 'sqlserver'] else 'boolean' %}
        {% set timestamp_type = 'datetime2(6)' if target.type in ['fabric', 'sqlserver'] else 'timestamp' %}
        select
            cast('under_65' as {{ string_type }}) as person_id
          , cast('medicare' as {{ string_type }}) as payer
          , cast('Continuing' as {{ string_type }}) as enrollment_status
          , cast('Female' as {{ string_type }}) as gender
          , cast('60-64' as {{ string_type }}) as age_group
          , cast('No' as {{ string_type }}) as medicaid_status
          , cast('Non' as {{ string_type }}) as dual_status
          , cast('Disabled' as {{ string_type }}) as orec
          , cast('No' as {{ string_type }}) as institutional_status
          , cast('No' as {{ string_type }}) as originally_disabled_flag
          , cast(null as {{ integer_type }}) as institutional_snp_flag
          , cast(0 as {{ boolean_type }}) as enrollment_status_default
          , cast(1 as {{ boolean_type }}) as medicaid_dual_status_default
          , cast(1 as {{ boolean_type }}) as orec_default
          , cast(1 as {{ boolean_type }}) as institutional_status_default
          , cast(2024 as {{ integer_type }}) as payment_year
          , cast('2023-01-01' as date) as collection_start_date
          , cast('2023-12-31' as date) as collection_end_date
          , cast('2024-01-01 00:00:00' as {{ timestamp_type }}) as tuva_last_run
        union all
        select
            cast('sixty_five' as {{ string_type }}) as person_id
          , cast('medicare' as {{ string_type }}) as payer
          , cast('Continuing' as {{ string_type }}) as enrollment_status
          , cast('Male' as {{ string_type }}) as gender
          , cast('65-69' as {{ string_type }}) as age_group
          , cast('No' as {{ string_type }}) as medicaid_status
          , cast('Non' as {{ string_type }}) as dual_status
          , cast('Aged' as {{ string_type }}) as orec
          , cast('No' as {{ string_type }}) as institutional_status
          , cast('No' as {{ string_type }}) as originally_disabled_flag
          , cast(null as {{ integer_type }}) as institutional_snp_flag
          , cast(0 as {{ boolean_type }}) as enrollment_status_default
          , cast(1 as {{ boolean_type }}) as medicaid_dual_status_default
          , cast(1 as {{ boolean_type }}) as orec_default
          , cast(1 as {{ boolean_type }}) as institutional_status_default
          , cast(2024 as {{ integer_type }}) as payment_year
          , cast('2023-01-01' as date) as collection_start_date
          , cast('2023-12-31' as date) as collection_end_date
          , cast('2024-01-01 00:00:00' as {{ timestamp_type }}) as tuva_last_run
